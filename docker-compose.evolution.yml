# ============================================
# DOCKER COMPOSE - EVOLUTION API v1.8.0
# ============================================
# Esta versión es más estable y no tiene
# problemas de LID. El número real viene
# directamente en key.remoteJid
# ============================================

version: '3.8'

services:
  # ============================================
  # POSTGRESQL - Base de datos
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: evolution_postgres
    restart: always
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evolution123
      - POSTGRES_DB=evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # EVOLUTION API v1.8.0
  # ============================================
  evolution-api:
    image: atendai/evolution-api:v1.8.0
    container_name: evolution_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # ===== Server =====
      - SERVER_URL=http://31.97.142.127:8080
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      
      # ===== Authentication =====
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=ElisaIA_Evolution_Key_2026_SecretKey
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      
      # ===== CORS =====
      - CORS_ORIGIN=*
      - CORS_METHODS=GET,POST,PUT,DELETE
      - CORS_CREDENTIALS=true
      
      # ===== Database =====
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution123@postgres:5432/evolution
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_v1.8.0
      
      # ===== Database Save Options =====
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      
      # ===== Logs =====
      - LOG_LEVEL=WARN
      - LOG_COLOR=true
      - LOG_BAILEYS=error
      
      # ===== Instance =====
      - DEL_INSTANCE=false
      - CONFIG_SESSION_PHONE_CLIENT=Elisa_IA
      - CONFIG_SESSION_PHONE_NAME=Chrome
      
      # ===== Webhook =====
      - WEBHOOK_GLOBAL_ENABLED=false
      - WEBHOOK_GLOBAL_URL=
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
      
      # ===== QR Code =====
      - QRCODE_LIMIT=6
      - QRCODE_COLOR=#198754
      
      # ===== WhatsApp Settings =====
      - WA_BUSINESS_TOKEN_WEBHOOK=evolution
      
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    networks:
      - evolution_network

networks:
  evolution_network:
    driver: bridge

volumes:
  postgres_data:
  evolution_instances:
  evolution_store:
